name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk SetTape.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SetTape-apk
          path: SetTape.apk

      - name: Publish as the "latest" release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest SetTape.apk --title "Latest build" --notes "Built from ${GITHUB_SHA}" --target "${GITHUB_SHA}"

      - name: Test the audio code
        run: gradle --no-daemon testReleaseUnitTest
